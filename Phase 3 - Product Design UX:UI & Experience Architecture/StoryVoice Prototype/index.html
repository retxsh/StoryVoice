.mobile-menu{display:none}.hide{display:none!important}.checkbox{display:flex;gap:9px;align-items:flex-start;font-size:11px;color:#56616b}.checkbox input{accent-color:var(--blue);margin-top:2px}.footer-actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.format{border:1px solid var(--line);border-radius:9px;padding:14px;background:white;text-align:left}.format.active{border-color:var(--blue);background:#f4f8fa}.format strong{display:block;font-size:13px}.format small{color:var(--slate);font-size:10px}

@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.project-layout{grid-template-columns:1fr}.two{grid-template-columns:1fr}.sidebar{width:205px}.shell{grid-template-columns:205px minmax(0,1fr)}}
/* Compact tablet navigation: retain the full content grid but move the rail into a drawer. */
@media(min-width:701px) and (max-width:860px){
 .topbar{height:60px;padding:0 22px}

@media(max-width:700px){.topbar{padding:0 17px;height:60px}.tagline{display:none}.shell{display:block;min-height:calc(100vh - 60px)}.sidebar{display:none;position:fixed;z-index:20;top:60px;left:0;bottom:0;width:250px;background:var(--paper);box-shadow:var(--shadow)}.sidebar.open{display:flex}.mobile-menu{display:inline-flex}.main{padding:25px 17px 60px}.page-head{flex-direction:column;align-items:stretch;margin-bottom:22px}.page-head .btn{align-self:flex-start}.grid{grid-template-columns:1fr}.three{grid-template-columns:1fr}.step-line{width:15px;margin:0 5px}.step{font-size:9px}.step span{display:none}.transcript{font-size:16px}.text-panel{min-height:220px}.footer-actions{position:sticky;bottom:0;background:var(--paper);padding:12px 0}.top-right{gap:8px}.prototype{font-size:9px}.two{gap:8px}}

<!-- Global app chrome: header, responsive navigation, page mount point and shared dialogs. -->
<div class="app">
<header class="topbar">
 <div class="row"><button class="btn small mobile-menu" id="menuToggle" aria-label="Open navigation">☰</button><div class="brand"><span class="brandmark">s</span>storyvoice <span class="tagline">Your voice. Your story.</span></div></div>
 <div class="top-right"><span class="prototype">PROTOTYPE · SAMPLE DATA</span><div class="avatar" aria-label="Writer profile">W</div></div>
</header>

</aside>

</div>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><h2 id="modalTitle">Confirm action</h2><div id="modalBody"></div><div class="modal-actions"><button class="btn" id="modalCancel">Cancel</button><button class="btn primary" id="modalConfirm">Continue</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* --------------------------------------------------------------------------
   STORYVOICE PROTOTYPE LOGIC
   This file is intentionally dependency-free. All state is in-memory demo
   state; recording, transcription and AI transformation are simulations.
   -------------------------------------------------------------------------- */

/* Sample manuscript material and the three explicitly scoped draft modes. */
const SOURCE=`I went back to the lighthouse that night. I mean, I hadn't been there in years. The road was almost gone, and the wind was making it difficult to hear anything. I remember seeing a light in the upper window, which didn't make sense because the place had been abandoned. I stopped the car. I wasn't sure if I should go inside. Then I heard something, maybe a door, or something hitting the wall. I don't know. I just stood there for a while.`;
const CLEAN=`I went back to the lighthouse that night. I hadn't been there in years. The road was almost gone, and the wind made it difficult to hear anything. I remember seeing a light in the upper window, which didn't make sense because the place had been abandoned. I stopped the car. I wasn't sure whether I should go inside. Then I heard something, perhaps a door or something hitting the wall. I don't know. I stood there for a while.`;
const READABLE=`I returned to the lighthouse that night, a place I hadn't visited in years. The road leading to it was almost gone, and the wind swallowed nearly every sound. Then I saw a light in the upper window.\n\nIt made no sense. The lighthouse had been abandoned.\n\nI stopped the car and sat there, unsure whether to go inside. A sound came from somewhere within the building. A door, perhaps. Or something striking the wall.\n\nI remained still for a while, listening.`;
const MODES={faithful:{name:"Faithful Transcript",desc:"Punctuation and minimal formatting only.",text:SOURCE},clean:{name:"Clean Transcript",desc:"Remove obvious disfluencies while retaining spoken structure.",text:CLEAN},readable:{name:"Readable Draft",desc:"Shape rough spoken language into readable prose without changing intended events.",text:READABLE}};
/* Fields copied between the active workspace and each project snapshot. */
const PROJECT_FIELDS=["sceneTitle","recordingTitle","recordingSceneId","source","draft","mode","draftReady","contextUse","recordingStatus","seconds","recordingSaved","transcriptEdited","draftEdited","accepted","rejected","restored","sceneText","scenes","activeSceneId","sceneEditBuffer","sceneEditDirty","sceneDescription","sceneCreated","format","exportScope","file","processing","context","draftVersions","transcriptionStatus","transcriptReady","sourceBuffer","sourceDirty","editorBuffer","editorDirty"];
const sampleContext=[{id:1,type:"Character",name:"Mara Ellison",detail:"Protagonist",approved:true},{id:2,type:"Location",name:"Greyhaven Lighthouse",detail:"Located on the northern coast",approved:true},{id:3,type:"Approved story fact",name:"Mara Ellison is the protagonist.",detail:"Writer-approved",approved:true},{id:4,type:"Approved story fact",name:"Greyhaven Lighthouse is located on the northern coast.",detail:"Writer-approved",approved:true},{id:5,type:"Approved story fact",name:"The lighthouse has been abandoned for eleven years.",detail:"Writer-approved",approved:true},{id:6,type:"Approved story fact",name:"Mara's father disappeared before the lighthouse was abandoned.",detail:"Writer-approved",approved:true}];
/* Create a clean project data model; sample=true seeds the demonstration project. */
function freshProjectData(sample=false){return {sceneTitle:sample?"The Lighthouse at Midnight":"Untitled scene",recordingTitle:sample?"The Lighthouse at Midnight — first pass":"Untitled recording",recordingSceneId:null,source:sample?SOURCE:"",draft:"",mode:"",draftReady:false,contextUse:true,recordingStatus:"ready",seconds:0,recordingSaved:false,transcriptEdited:false,draftEdited:false,accepted:false,rejected:false,restored:false,sceneText:"",scenes:[],activeSceneId:null,sceneEditBuffer:"",sceneEditDirty:false,sceneDescription:sample?"A late-night return to the abandoned lighthouse.":"",sceneCreated:false,format:"txt",exportScope:"scene",file:null,processing:false,context:sample?sampleContext.map(x=>({...x})):[],draftVersions:[],transcriptionStatus:"not-started",transcriptReady:sample,sourceBuffer:sample?SOURCE:"",sourceDirty:false,editorBuffer:"",editorDirty:false};}
/* Single active UI state. Project-specific values are snapshotted in state.projects[].data. */
let state={page:"projects",projects:[{id:1,title:"The Last Light",genre:"Literary Mystery",description:"A literary mystery centred on a disappearance, a forgotten letter and the memories of a small coastal town.",updated:"Opened today",scene:"No accepted scenes yet",status:"In progress",data:freshProjectData(true)}],projectId:1,...freshProjectData(true),timer:null,toastTimer:null,importError:""};
/* Project state isolation: persist the current in-memory model before switching projects. */
function snapshotProject(){const p=state.projects.find(x=>x.id===state.projectId);if(!p)return;p.data={};PROJECT_FIELDS.forEach(k=>p.data[k]=state[k]);}
function activateProject(id){snapshotProject();state.projectId=id;const p=state.projects.find(x=>x.id===id);if(!p)return;const d=p.data||freshProjectData(false);PROJECT_FIELDS.forEach(k=>state[k]=d[k]);}
/* Small DOM and UI helpers used by page renderers and delegated events. */
const $=s=>document.querySelector(s);
function toast(msg){let t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>t.classList.remove("show"),2800)}
function page(p){snapshotProject();state.page=p;$("#sidebar").classList.remove("open");render()}
function setNav(){document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===state.page))}
/* Shared markup helpers keep page headings, buttons, breadcrumbs and progress consistent. */
function heading(kicker,title,sub,action=""){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function btn(label,action,kind=""){const disabled=kind.includes("disabled");return `<button class="btn ${kind}" data-action="${action}" ${disabled?"disabled":""}>${label}</button>`}
function crumb(label="The Last Light"){return `<div class="crumb"><button data-action="projects">Projects</button> / ${label}</div>`}
function stepper(current){let a=["Project","Capture","Transcript","Transform","Review","Accept","Scene","Export"];let idx=a.indexOf(current);return `<div class="stepper">${a.map((x,i)=>`${i?'<i class="step-line"></i>':''}<div class="step ${i<idx?'done':i===idx?'current':''}"><b>${i<idx?'✓':i+1}</b><span>${x}</span></div>`).join("")}</div>`}
function status(text,cls=""){return `<span class="status"><i class="dot ${cls}"></i>${text}</span>`}
/* --------------------------------------------------------------------------
   PAGE RENDERERS
   Each renderer returns the HTML for one application route. Keep interactions
   declarative with data-action / data-page attributes and handle them below.
   -------------------------------------------------------------------------- */
function projectsPage(){if(!state.projects.length)return `${heading("YOUR WRITING SPACE","Projects","Your writing, organised in one place.",btn("+ New project","create","primary"))}<div class="empty"><div class="symbol">¶</div><h3>Your first project starts with an idea</h3><p>Create a project to give your recordings, drafts and accepted scenes a home.</p>${btn("Create your first project","create","primary")}</div>`;return `${heading("YOUR WRITING SPACE","Projects","Your writing, organised in one place.",btn("+ New project","create","primary"))}
<div class="section"><div class="section-title"><h2>Continue writing</h2><span class="tiny muted">Pick up where you left off</span></div><div class="grid">${state.projects.map(x=>`<article class="project-card"><div class="row between"><span class="eyebrow" style="margin:0">${x.genre||"Fiction project"}</span>${status(x.status==="In progress"?"In progress":"New","green")}</div><h3 style="margin-top:13px">${esc(x.title)}</h3><p>${esc(x.description||"A new writing project.")}</p><div class="card-foot"><span>${x.scene||"No scenes yet"} · ${x.updated}</span><button class="btn small" data-action="openProject" data-id="${x.id}">Open project →</button></div></article>`).join("")}</div></div>
<div class="section"><div class="section-title"><h2>All projects</h2><span class="tiny muted">${state.projects.length} project${state.projects.length===1?"":"s"}</span></div><div class="panel" style="padding:4px 19px">${state.projects.map(x=>`<div class="list-item"><div><strong>${esc(x.title)}</strong><small>${esc(x.genre||"Genre not set")} · Updated ${x.updated.toLowerCase()}</small></div><button class="btn small" data-action="openProject" data-id="${x.id}">Open</button></div>`).join("")}</div></div>`}
function createPage(){return `${crumb()}${heading("NEW PROJECT","Create a project","Give your manuscript a place to grow.")}<div class="panel" style="max-width:650px"><form id="projectForm"><div class="field" id="titleField"><label for="projectTitle">Project title <span style="color:var(--error)">*</span></label><input id="projectTitle" placeholder="e.g. The Last Light" required><span class="error-text">Add a title to continue.</span></div><div class="field"><label for="projectDescription">Description <span class="muted">(optional)</span></label><textarea id="projectDescription" placeholder="A few words about the story or the world…"></textarea></div><div class="field"><label for="genre">Genre <span class="muted">(optional)</span></label><select id="genre"><option value="">Choose a genre</option><option>Literary Mystery</option><option>Fantasy</option><option>Science Fiction</option><option>Romance</option><option>Thriller</option><option>Historical Fiction</option><option>Other</option></select></div><div class="field"><label for="notes">Project notes <span class="muted">(optional)</span></label><textarea id="notes" placeholder="Anything you want to remember about this project…"></textarea></div><div class="footer-actions"><button type="button" class="btn" data-action="projects">Cancel</button><button class="btn primary" type="submit">Create project</button></div></form></div>`}
function workspacePage(p){if(!p)return projectsPage();return `${crumb()}${heading("PROJECT WORKSPACE",esc(p.title),esc(p.description||"Your manuscript workspace."),btn("＋ Record a scene","capture","primary"))}<div class="project-layout"><div><div class="panel"><div class="panel-head"><h2>Continue working</h2><span class="tiny muted">Your next step</span></div><div class="row between"><div><strong style="font-size:13px">${state.accepted?"Review your accepted scene":"Capture a scene or spoken idea"}</strong><p class="tiny muted">${state.accepted?"Your passage is in the manuscript. You can review or export it.":"Start with a recording or bring in an existing audio file."}</p></div>${btn(state.accepted?"Open scene":"Start capture",state.accepted?"scene":"capture","primary")}</div></div><div class="panel"><div class="panel-head"><h2>Scenes</h2><span class="tiny muted">${(state.scenes||[]).length} accepted scene${(state.scenes||[]).length===1?"":"s"}</span></div>${(state.scenes||[]).length?state.scenes.map(sc=>`<div class="list-item"><div><strong>${esc(sc.title)}</strong><small>${status("Accepted manuscript","green")} · ${wordCount(sc.text)} words</small></div><button class="btn small" data-action="openScene" data-scene-id="${sc.id}">Open scene</button></div>`).join(""):`<div class="empty"><div class="symbol">¶</div><h3>Your scenes will appear as you accept writing</h3><p>Accepted passages can be organised into existing scenes or used to create a new one.</p>${btn("Capture your first scene","capture","small primary")}</div>`}</div></div><div class="panel"><div class="panel-head"><h2>Recent material</h2><span class="tiny muted">Project activity</span></div>${state.source.trim()?`<div class="list-item"><div><strong>${esc(state.recordingTitle)}</strong><small>Source transcript · ${state.recordingSaved?"Recording marked complete in prototype":"Sample source material"}</small></div>${btn("Review transcript","transcript","small")}</div>`:`<div class="list-item"><div><strong>No source material yet</strong><small>Record or import audio to begin a passage.</small></div>${btn("Capture audio","capture","small")}</div>`}${state.draftReady?`<div class="list-item"><div><strong>Current draft</strong><small>${MODES[state.mode]?.name||"Draft"} · ${state.accepted?"Accepted":"Unaccepted"}</small></div>${btn("Review draft","review","small")}</div>`:`<div class="list-item"><div><strong>No draft prepared</strong><small>Choose a transformation mode after reviewing a source transcript.</small></div>${btn("Review drafts","review","small")}</div>`}</div></div><aside><div class="panel"><h3>Project details</h3><div class="field"><label>Genre</label><div>${esc(p.genre||"Not specified")}</div></div><div class="field"><label>Project status</label>${status("In progress","green")}</div>${p.notes?`<div class="field"><label>Project notes</label><div class="tiny muted">${esc(p.notes)}</div></div>`:""}<div class="field"><label>Story context</label><div class="tiny muted">${state.context.length} items · writer-controlled</div>${btn("Manage story context","context","small")}</div></div><div class="panel"><h3>Quick actions</h3><div class="stack">${btn("Record audio","recorder")}${btn("Import audio","import")}${btn("Export accepted text","export")}</div></div></aside></div>`}
function capturePage(){return `${crumb()}${stepper("Capture")}${heading("CAPTURE","Bring a scene into StoryVoice","Choose how you want to capture this piece of your story.")}<div class="two"><button class="panel" style="text-align:left;padding:26px" data-action="recorder"><div style="font-size:25px;color:var(--blue)">◉</div><h2 style="margin-top:12px">Record audio</h2><p class="muted tiny">Capture a new thought, scene or passage with the in-product recorder.</p><span class="btn primary small">Start recording →</span></button><button class="panel" style="text-align:left;padding:26px" data-action="import"><div style="font-size:25px;color:var(--blue)">↥</div><h2 style="margin-top:12px">Import audio</h2><p class="muted tiny">Bring in a recording made with another device or application.</p><span class="btn small">Choose a file →</span></button></div><div class="notice" style="margin-top:17px">Prototype behaviour: recording and import are simulated. No microphone is accessed and no audio is uploaded to a server.</div><div class="footer-actions"><button class="btn" data-action="workspace">Back to project</button></div>`}
function recorderPage(){return `${crumb("Capture / Record")}${stepper("Capture")}${heading("RECORD AUDIO","Capture the moment","A quiet space to speak your scene as it comes to you.")}<div class="panel" style="max-width:700px;margin:0 auto"><div class="row between"><div><span class="label-pill">PROJECT</span><div style="font-size:12px;font-weight:600">${esc(state.projects.find(x=>x.id===state.projectId)?.title||"The Last Light")}</div></div><div class="field" style="margin:0;min-width:230px"><label for="recordingTitle">Recording title</label><input id="recordingTitle" value="${esc(state.recordingTitle)}"></div></div><div class="field" style="max-width:280px"><label for="sceneSelect">Save to / scene assignment</label><select id="sceneSelect"><option value="">Unassigned — organise later</option>${(state.scenes||[]).map(sc=>`<option value="${sc.id}" ${String(state.recordingSceneId)===String(sc.id)?"selected":""}>${esc(sc.title)}</option>`).join("")}</select></div><div class="center" style="padding:18px 0 5px"><div class="record-circle ${state.recordingStatus==="recording"?"live":""}" id="recordCircle">${state.recordingStatus==="recording"?"●":"◉"}</div><div class="timer" id="timer" aria-live="off" aria-label="Recording duration">${time(state.seconds)}</div><p id="recordState" class="muted tiny">${recordStateText()}</p><div class="wave" aria-hidden="true">${Array.from({length:35},(_,i)=>`<i style="--h:${state.recordingStatus==="recording"?`${8+(i*17%27)}px`:`${5+(i*7%9)}px`}"></i>`).join("")}</div><div class="action-row" style="justify-content:center;margin-top:15px">${recordButtons()}</div></div><div class="notice warn" style="margin-top:22px">Prototype simulation. The timer is illustrative; no microphone permission is requested and no audio file is created.</div></div><div class="footer-actions"><button class="btn" data-action="capture">Back</button>${state.recordingSaved?btn("Review transcript →","startTranscription","primary"):btn("Discard recording","discardRecord","danger")}</div>`}
function recordStateText(){return ({ready:"Ready to record",recording:"Recording in progress · simulated",paused:"Recording paused",saving:"Finishing recording…",saved:"Recording marked complete in this prototype",failed:"Recording could not be completed"})[state.recordingStatus]||"Ready"}
function recordButtons(){if(state.recordingStatus==="ready")return btn("Start recording","startRecord","primary")+btn("Simulate failure","recordFail","small");if(state.recordingStatus==="recording")return btn("Pause","pauseRecord")+btn("Stop","stopRecord","primary");if(state.recordingStatus==="paused")return btn("Resume","resumeRecord","primary")+btn("Stop","stopRecord");if(state.recordingStatus==="saved")return btn("Record again","resetRecord")+btn("Review transcript","startTranscription","primary");if(state.recordingStatus==="failed")return btn("Try again","resetRecord","primary")+btn("Use import instead","import");return btn("Try again","resetRecord","primary")}
function importPage(){return `${crumb("Capture / Import")}${stepper("Capture")}${heading("IMPORT AUDIO","Bring in a recording","Select a local audio file to use in this prototype.")}<div class="panel" style="max-width:720px"><label class="dropzone" for="audioFile" style="display:block;cursor:pointer"><div class="ico">↥</div><h3 style="margin:10px 0 5px">Choose an audio file</h3><p class="tiny muted">Select a file from this device. It will not be uploaded.</p><span class="btn small">Browse files</span><input id="audioFile" type="file" accept="audio/*" style="display:none"></label><div id="fileDetails" style="margin-top:16px">${state.importError?`<div class="notice error">${esc(state.importError)}</div>`:state.file?fileDetail():'<p class="tiny muted">No file selected.</p>'}</div><div class="notice" style="margin-top:15px">Format and size limits are intentionally not specified in this prototype. Actual support will be determined during technical research.</div><div class="footer-actions"><button class="btn" data-action="capture">Back</button><div class="action-row">${btn("Remove file","removeFile","")}${btn(state.importError?"Retry import":"Import audio","importAudio","primary")}</div></div></div>`}
function fileDetail(){return `<div class="list-item"><div><strong>${esc(state.file.name)}</strong><small>${(state.file.size/1024/1024).toFixed(2)} MB · ${esc(state.file.type||"File type not provided")}</small></div>${btn("Remove","removeFile","small")}</div>`}
function importingPage(){return `${crumb("Capture / Import")}${stepper("Capture")}${heading("IMPORTING AUDIO","Preparing your selected file","This is a local prototype simulation. The file is not uploaded.")}<div class="panel center" style="max-width:620px;margin:0 auto;padding:38px"><div class="record-circle">↥</div><h2 style="font-size:18px">Preparing audio reference</h2><p class="tiny muted">${esc(state.file?.name||"Selected audio file")}</p><div class="notice warn" style="text-align:left;margin-top:18px">No server upload or permanent storage takes place in this prototype.</div><div class="action-row" style="justify-content:center;margin-top:18px">${btn("Simulate import failure","importFail","small")}</div></div>`}
function transcribingPage(){return `${crumb("Capture / Transcription")}${stepper("Transcript")}${heading("TRANSCRIPTION","Preparing your source transcript","This is a simulated prototype step. Recording and transcript remain separate.")}<div class="panel center" style="max-width:620px;margin:0 auto;padding:40px"><div class="record-circle">≋</div><h2 style="font-size:18px">Transcribing sample audio</h2><p class="tiny muted">${esc(state.recordingTitle)}</p><div id="transcriptionStatus" class="tiny muted">${state.transcriptionStatus==="failed"?"Transcription could not be completed. Your source recording remains unchanged.":"Preparing a sample transcript…"}</div><div class="notice warn" style="text-align:left;margin-top:20px">Prototype simulation. No speech-to-text service is called and no real audio is processed.</div><div class="action-row" style="justify-content:center;margin-top:18px">${state.transcriptionStatus==="failed"?btn("Retry transcription","retryTranscription","primary"):btn("Simulate failure","transcriptionFail","small")}</div></div>`}
function startTranscription(){state.transcriptionStatus="processing";page("transcribing");setTimeout(()=>{if(state.page==="transcribing"&&state.transcriptionStatus==="processing"){state.transcriptionStatus="ready";state.transcriptReady=true;if(!state.source.trim())state.source=SOURCE;state.sourceBuffer=state.source;render();setTimeout(()=>{if(state.page==="transcribing"&&state.transcriptionStatus==="ready")page("transcript")},400)}},850)}
function transcriptPage(){return `${crumb("Draft review / Source transcript")}${stepper("Transcript")}${heading("SOURCE MATERIAL","Review your transcript","This is the editable source text. It is kept separate from every transformed draft.")}<div class="panel"><div class="row between"><div><span class="label-pill">SOURCE RECORDING</span><div style="font-weight:600;font-size:13px;margin-top:3px">${esc(state.recordingTitle)}</div><span class="tiny muted">Prototype sample · Original audio not stored</span></div>${status("Source transcript","blue")}</div><div class="panel" style="background:#faf9f6;margin:17px 0 0"><div class="row between"><strong style="font-size:12px">Audio reference</strong><span class="tiny muted">Playback simulated</span></div><div class="row" style="margin-top:12px"><button class="btn small" data-action="audioPlay" id="audioPlay">▶ Play sample</button><div style="height:4px;background:#e3e4e1;border-radius:5px;flex:1"><div id="audioProgress" style="height:4px;background:var(--blue);width:0;border-radius:5px"></div></div><span class="tiny muted">00:42</span></div></div><div class="version" style="margin-top:22px"><strong>Source transcript</strong><span class="tag">Editable source</span></div><label class="label-pill" for="sourceText">Editable source transcript</label><textarea id="sourceText" class="editor" style="min-height:280px">${esc(state.sourceBuffer??state.source)}</textarea><div class="row between" style="margin-top:12px"><span class="tiny muted">Correct recognition errors, names and punctuation. This does not change the original recording.</span><span class="tiny muted" id="sourceWords">${wordCount(state.source)} words</span></div><div class="row" style="margin-top:16px;justify-content:space-between;flex-wrap:wrap"><button class="btn" data-action="context">View project vocabulary</button><div class="action-row">${btn("Save transcript","saveTranscript")}${btn("Choose draft mode →","transform","primary")}</div></div></div>`}
function transformPage(){return `${crumb("Draft review / Transformation")}${stepper("Transform")}${heading("TRANSFORMATION","Choose how much to shape the text","Each mode creates a separate draft. Your source transcript remains unchanged.")}<div class="notice" style="margin-bottom:17px">You are working from <strong>Source transcript</strong> · ${wordCount(state.source)} words. Choose one mode to prepare a separate draft.</div><div class="three">${Object.entries(MODES).map(([id,x])=>`<button class="mode ${state.mode===id?"selected":""}" data-action="selectMode" data-mode="${id}"><div class="row between"><span class="radio-dot"></span><span class="tag">${id==="faithful"?"Minimal change":id==="clean"?"Light cleanup":"Prose shaping"}</span></div><h3>${x.name}</h3><p>${x.desc}</p><ul>${(id==="faithful"?["No sentence rewriting","No added story details","Keep original wording"]:id==="clean"?["Remove obvious disfluencies","Preserve meaningful repetition","Keep dialogue and fragments"]:["Preserve intended events and sequence","No invented actions or motivations","No added plot facts"]).map(y=>`<li>${y}</li>`).join("")}</ul></button>`).join("")}</div><div class="panel" style="margin-top:17px"><div class="panel-head"><h3>Project context</h3><span class="tag approved">Writer-approved items only</span></div><label class="checkbox"><input type="checkbox" id="useContext" ${state.contextUse?"checked":""}> Use approved project vocabulary and story facts as reference during transformation.</label><p class="tiny muted" style="margin:8px 0 0 23px">Context informs the draft; it does not override the recording or add new canonical facts. Relevant context will remain visible for review.</p></div><div class="footer-actions"><button class="btn" data-action="transcript">Back to transcript</button>${btn("Prepare draft →","prepareDraft",`primary ${state.mode?"":"disabled"}`)}</div>`}
function processingPage(){return `${crumb("Draft review / Preparing")}${stepper("Transform")}${heading("DRAFT PREPARATION","Preparing your draft","A separate draft is being prepared from your source transcript.")}<div class="panel center" style="max-width:620px;margin:0 auto;padding:42px"><div class="record-circle" style="font-size:20px">✎</div><h2 style="font-size:19px">Working from your source</h2><p class="muted tiny">${MODES[state.mode].name} · ${esc(state.recordingTitle)}</p><div style="height:5px;background:#e8e7e2;border-radius:5px;overflow:hidden;margin:24px 0"><div id="progressBar" style="height:100%;width:${state.processing?55:100}%;background:var(--blue);transition:width .5s"></div></div><div id="processingLabel" class="tiny muted">${state.processing?"Preparing sample draft…":"Sample draft is ready to review."}</div><div class="notice warn" style="text-align:left;margin-top:23px">Prototype simulation. No AI model is called. The displayed sample output is predefined demonstration content.</div><div class="action-row" style="justify-content:center;margin-top:20px">${state.processing?btn("Simulate a processing issue","processingFail","small"):btn("Review draft →","review","primary")}</div></div>`}
function reviewPage(){if(!state.draftReady)return `${crumb("Draft review")}${stepper("Review")}${heading("DRAFT REVIEW","No draft to review yet","Choose a transformation mode to prepare a separate draft from your source transcript.")}<div class="empty"><div class="symbol">⇄</div><h3>Your source is ready when you are</h3><p>The source transcript remains unchanged. Select a transformation mode to create a reviewable draft.</p>${btn("Choose a draft mode","transform","primary")}</div>`;return `${crumb("Draft review")}${stepper("Review")}${heading("DRAFT REVIEW","Review your draft","Compare the transformed text with the source before deciding what enters your manuscript.")}<div class="row between" style="margin-bottom:13px;flex-wrap:wrap"><div><span class="label-pill">TRANSFORMATION MODE</span><div style="font-size:13px;font-weight:600">${MODES[state.mode].name}</div></div>${status(state.accepted?"Accepted":"Unaccepted draft",state.accepted?"green":"orange")}</div><div class="change-summary"><strong>Change summary</strong><div style="margin-top:4px">${changeSummary()}</div></div><div class="two" style="margin-top:15px"><section class="text-panel"><div class="version"><strong>Source transcript</strong><span class="tag">Original wording</span></div><div class="transcript smalltext">${esc(state.source)}</div><div class="tiny muted" style="margin-top:15px">${wordCount(state.source)} words · Source preserved</div></section><section class="text-panel"><div class="version"><strong>Transformed draft</strong><span class="tag" style="background:var(--soft);color:var(--blue)">${MODES[state.mode].name}</span></div><div class="transcript smalltext">${esc(state.draft)}</div><div class="tiny muted" style="margin-top:15px">${wordCount(state.draft)} words · ${state.draftEdited?"Edited by writer":"Prototype sample draft"}</div></section></div>${state.contextUse?`<div class="notice" style="margin-top:13px">Context selected: ${state.context.filter(x=>x.approved).map(x=>esc(x.name)).join(" · ")||"No approved items"}. Context is reference only; writer approval is still required.</div>`:""}<div class="panel" style="margin-top:16px"><div class="panel-head"><h3>What would you like to do?</h3><span class="tiny muted">${state.accepted?"This version has been accepted":"Nothing is accepted yet"}</span></div><div class="action-row">${btn("Edit draft","editor")}${btn("Prepare another draft","transform")}${btn("Restore original","restore","")}${state.accepted?"":btn("Reject draft","reject","danger")}<span style="flex:1"></span>${state.accepted?btn("Open accepted scene →","scene","primary"):btn("Accept draft →","organise","primary")}</div></div><div class="panel"><div class="panel-head"><h3>Draft history</h3><span class="tiny muted">Previous versions remain separate</span></div>${(state.draftVersions||[]).map((v,i)=>`<div class="list-item"><div><strong>${esc(v.label||"Draft version")}</strong><small>${esc(MODES[v.mode]?.name||v.mode)} · ${wordCount(v.text)} words${i===0?" · Latest":""}</small></div>${btn("Load version","loadVersion","small") .replace('data-action="loadVersion"',`data-action="loadVersion" data-version="${v.id}"`)}</div>`).join("")||'<p class="tiny muted">No draft versions yet.</p>'}</div>`}
function changeSummary(){const delta=wordCount(state.draft)-wordCount(state.source),countText=`Source: ${wordCount(state.source)} words · Draft: ${wordCount(state.draft)} words · ${delta===0?"same word count":`${delta>0?"+":""}${delta} words`}.`;if(state.mode==="faithful")return `Faithful Transcript keeps the source wording. This sample changes only punctuation and minimal formatting. ${countText}`;if(state.mode==="clean")return `Clean Transcript removes obvious verbal disfluencies and makes small readability adjustments while keeping the spoken structure. In the supplied sample, “I mean” and “just” are removed and a few phrases are tightened. ${countText}`;return `Readable Draft reshapes spoken phrasing into readable paragraphs. In the supplied sample, the opening and several sentences are rewritten for flow; the stated sequence of events is retained, with no new plot event added. ${countText}`}

/* Build a minimal Office Open XML DOCX locally, without a server or dependency. */

 entries.forEach(entry=>{paras.push(`<w:p><w:pPr><w:pStyle w:val="Heading1"/></w:pPr><w:r><w:t>${escXml(entry.title)}</w:t></w:r></w:p>`);entry.text.split(/\n\s*\n/).forEach(part=>paras.push(`<w:p><w:pPr><w:spacing w:after="180" w:line="360" w:lineRule="auto"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/><w:sz w:val="24"/></w:rPr><w:t xml:space="preserve">${escXml(part)}</w:t></w:r></w:p>`));});

function zipStore(files){

 case"saveTranscript":state.source=$("#sourceText").value;state.sourceBuffer=state.source;state.sourceDirty=false;state.transcriptEdited=true;snapshotProject();toast("Source transcript updated in this prototype session.");$("#sourceWords").textContent=wordCount(state.source)+" words";break;
 case"restore":openModal("Restore original source?","The transformed draft will be replaced with the source transcript as a new draft. The source itself remains unchanged.","Restore draft",()=>{state.draft=state.source;state.mode="faithful";state.draftReady=true;state.accepted=false;state.draftEdited=false;state.editorBuffer=state.draft;state.restored=true;pushDraftVersion("Restored from source transcript");page("review");toast("A source-based draft is ready to review.")});break;
 case"reject":openModal("Reject this draft?","The unaccepted draft will be marked as rejected. Your source transcript remains available.","Reject draft",()=>{state.rejected=true;state.accepted=false;state.draftReady=false;page("transcript");toast("Draft rejected. Source transcript preserved.")});break;
 case"restoreDraft":state.editorBuffer=modeOutput(state.mode);state.editorDirty=false;render();toast("Draft editor reset to the current transformation.");break;
 case"saveDraft":state.draft=state.editorBuffer??$("#draftEditor").value;state.editorBuffer=state.draft;state.editorDirty=false;state.draftEdited=true;state.accepted=false;pushDraftVersion("Writer-edited draft");render();toast("Draft edits updated in this prototype session.");break;
 case"acceptDraft":{if(!state.source.trim()||!state.draft.trim()||!state.draftReady){toast("Prepare and review a draft before accepting it.");break;}const dest=$("#destination").value;let target;if(dest==="new"){const id=Date.now();target={id,title:$("#sceneTitleInput").value.trim()||"Untitled scene",description:$("#sceneDescriptionInput").value,text:state.draft,recordingTitle:state.recordingTitle,mode:state.mode,draftVersions:(state.draftVersions||[]).map(v=>({...v}))};state.scenes=state.scenes||[];state.scenes.push(target);}else{target=(state.scenes||[]).find(sc=>String(sc.id)===dest);if(!target){toast("Choose a valid scene destination.");break;}target.text=(target.text?target.text+"\\n\\n":"")+state.draft;target.recordingTitle=state.recordingTitle;target.mode=state.mode;target.draftVersions=(state.draftVersions||[]).map(v=>({...v}));}state.activeSceneId=target.id;state.sceneTitle=target.title;state.sceneDescription=target.description||"";state.sceneText=target.text;state.sceneCreated=true;state.accepted=true;state.rejected=false;let proj=state.projects.find(x=>x.id===state.projectId);if(proj){proj.scene=`${state.scenes.length} accepted scene${state.scenes.length===1?"":"s"}`;proj.updated="Just now";proj.data={};PROJECT_FIELDS.forEach(k=>proj.data[k]=state[k]);}page("scene");toast("Draft accepted and added to the selected scene.");break;}
 case"format":state.format=b.dataset.format;render();break;case"doExport":state.exportScope=$("#exportScope").value;exportText();break;case"exportFail":{let r=$("#exportResult");if(r)r.innerHTML='<div class="notice error">The export could not be prepared in this simulation. Your accepted manuscript remains unchanged. Retry the export when ready.</div>';break;}
 case"removeFile":state.file=null;state.importError="";render();break;case"importAudio":if(!state.file){toast("Choose a local audio file first.");break;}state.recordingTitle=state.file.name.replace(/\.[^.]+$/,"");toast("Import selected locally. No file was uploaded.");page("importing");setTimeout(()=>{if(state.page==="importing")startTranscription()},650);break;case"importFail":page("import");state.importError="The prototype import step could not be completed. Your selected file remains local; try again.";render();break;
 case"audioPlay":{let x=$("#audioPlay");x.textContent="Ⅱ Playing sample";let bar=$("#audioProgress");bar.style.width="64%";setTimeout(()=>{if($("#audioPlay")){$("#audioPlay").textContent="▶ Play sample";bar.style.width="0"}},1700);break;}
 case"addContext":contextForm();break;case"editContext":{let row=b.closest(".context-row"),id=Number(row.querySelector("[data-context-id]")?.dataset.contextId);let item=state.context.find(x=>x.id===id);if(item)contextForm(item);else toast("Select a context item to edit.");break;}
 case"deleteContext":{let row=b.closest(".context-row"),id=Number(row.querySelector("[data-context-id]")?.dataset.contextId);openModal("Delete context item?","This removes the selected item from the prototype context list.","Delete",()=>{state.context=state.context.filter(x=>x.id!==id);render();toast("Context item deleted.")});break;}
 }
});
/* Context form is rendered inside the shared modal; approval is always writer-controlled. */
function contextForm(item=null){
 $("#modalTitle").textContent=item?"Edit story context":"Add story context";
 $("#modalBody").innerHTML=`<form id="contextForm"><div class="field"><label for="contextType">Type</label><select id="contextType"><option ${item?.type==="Character"?"selected":""}>Character</option><option ${item?.type==="Location"?"selected":""}>Location</option><option ${item?.type==="Terminology"?"selected":""}>Terminology</option><option ${item?.type==="Approved story fact"?"selected":""}>Approved story fact</option><option ${item?.type==="Suggestion"?"selected":""}>Suggestion</option></select></div><div class="field"><label for="contextName">Name or fact</label><input id="contextName" required maxlength="240" value="${esc(item?.name||"")}" placeholder="Enter a name, term or fact"></div><div class="field"><label for="contextDetail">Description <span class="muted">(optional)</span></label><textarea id="contextDetail" maxlength="500">${esc(item?.detail||"")}</textarea></div><label class="checkbox"><input type="checkbox" id="contextApproved" ${item?.approved?"checked":""}> Mark as writer-approved</label><p class="hint">Suggestions are not used as approved story facts until you approve them.</p></form>`;
 $("#modalConfirm").textContent=item?"Save changes":"Add item";$("#modalBackdrop").classList.add("open");$("#contextName").focus();
 $("#modalConfirm").onclick=()=>{const name=$("#contextName").value.trim();if(!name){$("#contextName").focus();toast("Enter a name or fact before saving.");return;}const obj={id:item?.id||Date.now(),type:$("#contextType").value,name,detail:$("#contextDetail").value.trim(),approved:$("#contextApproved").checked};if(item)Object.assign(item,obj);else state.context.push(obj);$("#modalBackdrop").classList.remove("open");snapshotProject();render();toast("Story context updated in this prototype session.");};
}
/* Form submissions, native control changes, navigation guards and live editing. */
document.addEventListener("submit",e=>{if(e.target.id!=="projectForm")return;e.preventDefault();let title=$("#projectTitle").value.trim();if(!title){$("#titleField").classList.add("invalid");$("#projectTitle").focus();return;}let p={id:Date.now(),title,genre:$("#genre").value,description:$("#projectDescription").value.trim(),notes:$("#notes").value.trim(),updated:"Just now",scene:"No accepted scenes yet",status:"In progress",data:freshProjectData(false)};state.projects.unshift(p);activateProject(p.id);page("workspace");toast("Project created in prototype state.");});
document.addEventListener("change",e=>{if(e.target.id==="audioFile"){let f=e.target.files?.[0];if(f){if(!f.type.startsWith("audio/")){state.file=null;state.importError="This selection is not identified by the browser as an audio file. Choose an audio file or try another source.";render();return;}state.file=f;state.importError="";render()}}if(e.target.id==="destination"){$("#newSceneFields")?.classList.toggle("hide",e.target.value!=="new")}if(e.target.id==="sceneSelect"){state.recordingSceneId=e.target.value||null;snapshotProject()}if(e.target.id==="exportScope"){state.exportScope=e.target.value;render()}});
/* Protect unsaved edits from accidental browser navigation or refresh. */
window.addEventListener("beforeunload",e=>{if(state.editorDirty||state.sourceDirty||state.sceneEditDirty){e.preventDefault();e.returnValue="";}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modalBackdrop").classList.contains("open"))closeModal();});
$("#menuToggle").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));$("#modalCancel").addEventListener("click",closeModal);$("#modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
document.addEventListener("input",e=>{if(e.target.id==="draftEditor"){state.editorBuffer=e.target.value;state.editorDirty=true;$("#unsaved").textContent="Unsaved edits · save before leaving";}if(e.target.id==="sourceText"){state.sourceBuffer=e.target.value;state.sourceDirty=true;$("#sourceWords").textContent=wordCount(e.target.value)+" words · unsaved";}if(e.target.id==="acceptedSceneEditor"){state.sceneEditBuffer=e.target.value;state.sceneEditDirty=true;}});
/* Initial route render. */
render();
</script>
</body></html>
